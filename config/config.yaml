  db: 0
  ttl: 3600

# -- AI Engine --------------------------------------------------------
ai_engine:
  model: claude-haiku-4-5-20251001
  max_tokens: 1024
  temperature: 0

  # -- Institutional Logic ---------------------------------------------
  institutional_logic:
    ob_volume_factor: 1.5
    break_even_ratio: 1.0

  # -- Testing / Benchmarking ------------------------------------------
  testing_mode:
    # Parametros de senales institucionales
    volume_threshold: 1.5        # RVOL minimo para validar FVG/OB
    sweep_lookback_hours: 24     # Ventana para Liquidity Sweeps
    wvdi_threshold: 1.5          # WVDI minimo para validar sweep
    vix_percentile: 90.0         # Percentil Delta-VIX para bloqueo de crisis
    rsi_overbought: 80.0         # RSI HTF > este valor = bloquear BUY
    rsi_oversold: 20.0           # RSI HTF < este valor = bloquear SELL

    # Aislamiento de motores
    engine_isolation:
      enabled: true   # true = aislamiento, false = consenso normal
      target_engine: smc_ict  # Opciones: gap_sniper, smc_ict, carry_trade, etc.
